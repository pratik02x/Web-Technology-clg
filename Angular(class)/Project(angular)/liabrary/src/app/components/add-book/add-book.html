<div class="card p-4 shadow-sm mb-4">
  <h4>📚 Add New Book</h4>
  <div class="row g-3">
    <div class="col"><input [(ngModel)]="newBook.title" placeholder="Book Title" class="form-control"></div>
    <div class="col"><input [(ngModel)]="newBook.author" placeholder="Author" class="form-control"></div>
    <div class="col"><input [(ngModel)]="newBook.category" placeholder="Category" class="form-control"></div>
    <div class="col"><button (click)="saveBook()" class="btn btn-primary">Add</button></div>
  </div>
</div>

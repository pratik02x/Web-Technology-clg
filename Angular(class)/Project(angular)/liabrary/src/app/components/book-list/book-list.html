<div class="card p-3 shadow-sm">
  <h3>Library Inventory</h3>
  <table class="table table-hover">
    <thead class="table-dark">
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of books">
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.category }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="removeBook(book.id)">Remove</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

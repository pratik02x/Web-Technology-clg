<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Fun API Showcase</h1>
    <div class="container">
        <div class="card">
            <img src="dog_img.png" id="dogimg" alt="dog image">
            <p>Click the button to generate random dog images 🐶</p><br><br>
            <div class="buttons">
               <button id="getdog">Get Image</button> 
               <a href=""></a><button id="seedog">See All Images</button>
            </div>
            

        </div>
        <div class="card">
            <img src="cat_img.png" alt="cat image" id="catimg">
            <p>Click the button to generate random cat images 🐶</p><br><br>
            <div class="buttons">
                <button id="getcat">Get Image</button>
                <button id="seecat">See All Images</button>
            </div>
        </div>
        <div class="card">
            <img src="jokes_img.png" alt="joke image" >
            <p id="joke">Click the button to generate random Jokes</p><br><br>
            <div class="buttons">
                <button id="getjoke">Get Jokes</button>
                <button id="seejoke">See All Jokes</button>
            </div>
        </div>
        
    </div>
    <div id="alldogs"></div>
    <script src="app.js"></script>
</body>
</html>

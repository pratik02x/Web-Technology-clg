<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat App</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 40px; }
        .chat-container { background: white; width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        #messages { list-style-type: none; padding: 0; height: 300px; overflow-y: auto; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; margin-bottom: 15px; }
        #messages li { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
        #messages li:nth-child(odd) { background-color: #fdfdfd; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>WebSocket Chat</h2>
    
    <ul id="messages"></ul>
    
    <div class="input-area">
        <input type="text" id="message" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 1. Connect to the WebSocket Server
    const ws = new WebSocket("ws://localhost:3000");

    // 2. Triggered when the connection is successful
    ws.onopen = () => {
        console.log("Connected to server");
    };

    // 3. Triggered when a message is received from the server
    ws.onmessage = (event) => {
        const li = document.createElement("li");
        li.textContent = "💬 " + event.data;
        document.getElementById("messages").appendChild(li);
        
        // Auto-scroll to the bottom of the chat
        const msgList = document.getElementById("messages");
        msgList.scrollTop = msgList.scrollHeight;
    };

    // 4. Function to send a message to the server
    function sendMessage() {
        const input = document.getElementById("message");
        if (input.value.trim() !== "") {
            ws.send(input.value);
            input.value = ""; // Clear input field
        }
    }

    // Allow pressing "Enter" to send message
    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
